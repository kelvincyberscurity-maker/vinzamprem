<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinz Web</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}body{overflow:hidden}#web{width:100%;height:100%;border:0;display:none}#loading,#error{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;padding:20px;z-index:10}.card{width:min(490px,100%);padding:30px 24px;text-align:center;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 10px 35px #00000012}.spin{width:44px;height:44px;border:4px solid #e5e7eb;border-top-color:#111;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:23px;margin:0 0 10px}p{color:#666;line-height:1.5;margin:8px 0}.small{font-size:13px;color:#888;word-break:break-all}button{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid #111;background:#111;color:#fff;font-weight:700}.hide{display:none!important}
</style>
</head>
<body>
<div id="loading"><div class="card"><div class="spin"></div><h1>Memuat Vinz Web</h1><p>Mohon tunggu, sedang membuka website.</p><p class="small">tex.ravenhost.space:17730</p></div></div>
<div id="error" class="hide"><div class="card"><h1>Website tidak dapat ditampilkan</h1><p id="msg">Proxy tidak dapat menghubungi server tujuan.</p><p class="small">Server tujuan: http://tex.ravenhost.space:17730/</p><button onclick="location.reload()">Coba Lagi</button></div></div>
<iframe id="web" src="/proxy/" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
const f=document.getElementById('web'),l=document.getElementById('loading'),e=document.getElementById('error');
let ok=false;
f.addEventListener('load',()=>{ok=true;l.classList.add('hide');e.classList.add('hide');f.style.display='block';});
setTimeout(()=>{if(!ok){l.classList.add('hide');e.classList.remove('hide');}},20000);
</script>
</body>
</html>
