<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#050509">
  <title>Raven Web</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#050509;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#050509}
    #error{
      display:none;position:fixed;inset:0;padding:28px;color:#fff;
      font:15px/1.6 system-ui,sans-serif;background:#050509;
    }
  </style>
</head>
<body>
  <iframe
    src="http://tex.ravenhost.space:17730/"
    title="Vinz"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer">
  </iframe>

  <div id="error">
    <h2>Website tidak dapat ditampilkan</h2>
    <p>Browser dapat memblokir halaman HTTP yang dibuka dari halaman HTTPS.
    Untuk hasil yang benar-benar HTTPS, aktifkan HTTPS langsung pada server/domain
    <b>tex.ravenhost.space</b>.</p>
  </div>
</body>
</html>
